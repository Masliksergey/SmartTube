name: Build APK

# Запуск ТІЛЬКИ вручну: GitHub -> Actions -> "Build APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (з сабмодулями MediaServiceCore і SharedModules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build ststable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStstableDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Ambilight-apk
          path: smarttubetv/build/outputs/apk/ststable/debug/*.apk
          if-no-files-found: error
